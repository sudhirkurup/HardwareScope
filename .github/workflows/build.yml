name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HardwareScope-apk
          path: app/build/outputs/apk/release/*.apk

      # Publishes the APK at a fixed link that opens directly on a phone:
      # https://github.com/<owner>/<repo>/releases/download/latest/HardwareScope.apk
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk HardwareScope.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HardwareScope.apk --target "$GITHUB_SHA" \
            --title "HardwareScope – latest build" \
            --notes "Open this page on your Android phone and tap HardwareScope.apk to install. Built from ${GITHUB_SHA::7}."
